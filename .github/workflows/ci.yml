name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux GCC ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build python3 python3-numpy zlib1g-dev
      - name: Configure
        run: cmake --preset ${{ matrix.configuration }}
      - name: Build
        run: cmake --build --preset ${{ matrix.configuration }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.configuration }}
      - name: Run synthetic tests
        if: matrix.configuration == 'debug'
        run: |
          python3 -m unittest discover -s tools/research -p 'test_*.py'
          python3 -m unittest discover -s tools/disc -p 'test_*.py'
          python3 -m unittest discover -s tools/ghidra -p 'test_*.py'
